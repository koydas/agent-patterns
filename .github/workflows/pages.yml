name: Playground (GitHub Pages)

# Builds site/ (the interactive playground) from the repository content and deploys it to
# https://koydas.github.io/agent-patterns/. Requires Settings → Pages → Source: GitHub Actions.
on:
  pull_request:
    paths: ['site/**', 'patterns/**', 'README.md', '_data/**', 'docs/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'patterns/**', 'README.md', '_data/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Pattern tests (offline impls)
        working-directory: .
        run: node --test patterns/*/impl.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
